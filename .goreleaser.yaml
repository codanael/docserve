version: 2

builds:
  - id: docserve
    main: ./cmd/docserve
    binary: docserve
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: docserve
    ids:
      - docserve
    formats:
      - tar.gz
    name_template: "docserve_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: docserve
    package_name: docserve
    file_name_template: "docserve_{{ .Version }}_{{ .Arch }}"
    vendor: codanael
    homepage: https://github.com/codanael/docserve
    maintainer: Anael LATASSA
    license: MIT
    description: Self-hosted MCP documentation server
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./docserve.example.yaml
        dst: /etc/docserve/docserve.example.yaml
        type: config
      - src: ./docserve.service
        dst: /usr/lib/systemd/system/docserve.service
        type: config
    scripts:
      postinstall: packaging/postinstall.sh
      preremove: packaging/preremove.sh

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

dockers_v2:
  - id: docserve
    dockerfile: Dockerfile
    images:
      - "ghcr.io/codanael/docserve"
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    ids:
      - docserve
    labels:
      "org.opencontainers.image.source": "https://github.com/codanael/docserve"
      "org.opencontainers.image.description": "MCP documentation server"
      "org.opencontainers.image.version": "{{ .Version }}"

docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"
    output: true

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^style:"
      - "^chore:"
  groups:
    - title: Features
      regexp: "^.*feat.*:+.*$"
    - title: Bug Fixes
      regexp: "^.*fix.*:+.*$"
    - title: Refactoring
      regexp: "^.*refactor.*:+.*$"
    - title: Other
      order: 999
