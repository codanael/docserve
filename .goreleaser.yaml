version: 2

builds:
  - id: docserve
    main: ./cmd/docserve
    binary: docserve
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: docserve
    ids:
      - docserve
    formats:
      - tar.gz
    name_template: "docserve_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    output: true

dockers_v2:
  - id: docserve
    dockerfile: Dockerfile
    images:
      - "ghcr.io/codanael/docserve"
    tags:
      - "v{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    ids:
      - docserve
    labels:
      "org.opencontainers.image.source": "https://github.com/codanael/docserve"
      "org.opencontainers.image.description": "MCP documentation server"
      "org.opencontainers.image.version": "{{ .Version }}"

docker_signs:
  - cmd: cosign
    artifacts: all
    args:
      - "sign"
      - "${artifact}@${digest}"
      - "--yes"
    output: true
