data_dir: ./data
listen: ":8080"

providers:
  - type: github
    proxy: false
    repos:
      - name: spring-boot
        slug: spring-projects/spring-boot
        refs:
          - ref: main
            paths:
              - "documentation/spring-boot-docs/"

  - type: confluence
    base_url: https://confluence.atlassian.com
    proxy: false
    pages:
      - space: CONF
        id: "1627457156"
        depth: 0

  - type: confluence
    base_url: https://cwiki.apache.org/confluence
    proxy: false
    pages:
      - name: kafka-proposals
        space: KAFKA
        id: "50859233"
        depth: 1
      - name: flink-release
        space: FLINK
        id: "308152924"
        depth: 0
